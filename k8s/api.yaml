apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: vector94/offbook:1.0
          command: ["uvicorn", "offbook.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: LICHESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: offbook
                  key: LICHESS_TOKEN
            - name: ENGINE_SERVICE_URL
              value: http://engine:8001
            - name: INSIGHT_SERVICE_URL
              value: http://insight:8002
            - name: CORS_ORIGINS
              value: http://localhost:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8000

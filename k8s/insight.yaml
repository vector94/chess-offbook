apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight
spec:
  selector:
    matchLabels:
      app: insight
  template:
    metadata:
      labels:
        app: insight
    spec:
      containers:
        - name: insight
          image: vector94/offbook:1.0
          command: ["uvicorn", "offbook.insight.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          env:
            - name: INSIGHT_DATABASE_URL
              value: postgresql://offbook:offbook@postgres/offbook_insight
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: llama3.2:1b
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: insight
spec:
  selector:
    app: insight
  ports:
    - port: 8002

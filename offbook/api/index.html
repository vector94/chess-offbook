<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OffBook</title>
<style>
  body { font: 15px/1.5 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 14px; font: inherit; border: 0; border-radius: 6px; background: #3aa06a; color: #fff; cursor: pointer; }
  #msg { color: #c33; min-height: 1.5em; }
  .card { display: none; border: 1px solid #e3e3e3; border-radius: 10px; padding: 16px; }
  .card.show { display: block; }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .head img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #eee; }
  .name { font-weight: 600; font-size: 17px; }
  .head a { color: #3aa06a; text-decoration: none; font-size: 14px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
  dt { color: #888; }
  dd { margin: 0; }
</style>
</head>
<body>
  <h1>OffBook</h1>
  <form id="f">
    <input id="u" placeholder="chess.com username" autocomplete="off" autofocus />
    <button>Look up</button>
  </form>
  <p id="msg"></p>
  <div id="card" class="card">
    <div class="head">
      <img id="avatar" alt="" />
      <div>
        <div class="name" id="name"></div>
        <a id="link" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <dl id="fields"></dl>
  </div>

<script>
const form = document.getElementById("f");
const msg = document.getElementById("msg");
const card = document.getElementById("card");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("u").value.trim();
  if (!username) return;
  msg.textContent = "Loading...";
  card.classList.remove("show");
  try {
    const res = await fetch("/api/profile?username=" + encodeURIComponent(username));
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.detail || ("Error " + res.status);
      return;
    }
    render(data);
    msg.textContent = "";
  } catch {
    msg.textContent = "Request failed";
  }
});

function render(p) {
  document.getElementById("avatar").src = p.avatar || "";
  document.getElementById("name").textContent = p.name || p.username;
  const link = document.getElementById("link");
  link.textContent = "@" + p.username;
  link.href = p.url;

  const date = (s) => (s ? new Date(s).toLocaleDateString() : "—");
  const ratings =
    Object.entries(p.ratings || {})
      .map(([k, v]) => k + " " + v)
      .join("  ·  ") || "—";

  const rows = [
    ["Country", p.country || "—"],
    ["Followers", p.followers],
    ["Joined", date(p.joined)],
    ["Last online", date(p.last_online)],
    ["Ratings", ratings],
  ];
  const dl = document.getElementById("fields");
  dl.replaceChildren();
  for (const [label, value] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }
  card.classList.add("show");
}
</script>
</body>
</html>

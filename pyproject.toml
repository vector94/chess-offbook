[project]
name = "chess-offbook"
version = "0.1.0"
description = "See where you leave chess opening theory: Chess.com games checked against the Lichess opening explorer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.139",
    "httpx>=0.28.1",
    "python-chess>=1.999",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offbook"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
